<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGO Knowledge Assistant — RAG Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0: #0A0F1A;
    --panel: #101A2E;
    --panel-raised: #142138;
    --border: #223049;
    --text: #EAF0FA;
    --text-dim: #8CA0C4;
    --blue: #4C8DFF;
    --blue-soft: #2B4C82;
    --green: #3ECF8E;
    --amber: #F5A623;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(76,141,255,0.14), transparent 60%),
      var(--bg-0);
    color:var(--text);font-family:'Inter',sans-serif;
    display:flex;flex-direction:column;height:100vh;
  }
  header{
    padding:16px 28px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  h1{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;}
  .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);}

  .layout{flex:1;display:flex;overflow:hidden;}
  .chat-col{flex:1;display:flex;flex-direction:column;max-width:760px;margin:0 auto;width:100%;}
  .messages{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:18px;}

  .msg{max-width:80%;}
  .msg.user{align-self:flex-end;}
  .msg.assistant{align-self:flex-start;}
  .bubble{
    padding:13px 16px;border-radius:12px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;
  }
  .msg.user .bubble{background:linear-gradient(135deg, var(--blue), #3868C7);color:#fff;border-bottom-right-radius:3px;}
  .msg.assistant .bubble{background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:3px;}

  .sources{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
  .source-chip{
    display:flex;align-items:center;gap:8px;background:var(--panel-raised);border:1px solid var(--border);
    border-radius:7px;padding:8px 11px;font-size:11.5px;
  }
  .source-title{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--blue);white-space:nowrap;}
  .source-cat{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--text-dim);white-space:nowrap;}
  .source-snip{color:var(--text-dim);font-size:11px;}

  .empty-state{margin:auto;text-align:center;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:12.5px;max-width:360px;}
  .empty-state .eyebrow{color:var(--blue);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}

  .input-bar{padding:16px 20px 22px;border-top:1px solid var(--border);}
  .input-row{display:flex;gap:10px;max-width:760px;margin:0 auto;}
  input[type=text]{
    flex:1;background:var(--panel);border:1px solid var(--border);border-radius:9px;
    padding:13px 15px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;outline:none;
  }
  input[type=text]:focus{border-color:var(--blue);}
  button{
    background:linear-gradient(135deg, var(--blue), #3868C7);border:none;border-radius:9px;
    padding:0 20px;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer;
  }
  button:disabled{opacity:.5;cursor:not-allowed;}

  .typing{display:flex;gap:4px;padding:4px 0;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--text-dim);animation:bounce 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes bounce{0%,60%,100%{opacity:.3;}30%{opacity:1;}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    <div>
      <h1>NGO Knowledge Assistant</h1>
      <div class="sub">Retrieval-Augmented Generation · ChromaDB + Claude</div>
    </div>
  </div>
  <div class="sub">25 policy documents indexed</div>
</header>

<div class="layout">
  <div class="chat-col">
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="eyebrow">Try asking</div>
        "What happens if a patient misses two appointments?"<br><br>
        "What are volunteers required to do before starting?"<br><br>
        "What's our policy on data breaches?"
      </div>
    </div>
    <div class="input-bar">
      <div class="input-row">
        <input type="text" id="queryInput" placeholder="Ask a question about the organization's policies…" onkeydown="if(event.key==='Enter')sendQuery()">
        <button id="sendBtn" onclick="sendQuery()">Ask →</button>
      </div>
    </div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('queryInput');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');

async function sendQuery(){
  const query = inputEl.value.trim();
  if(!query) return;
  emptyState.remove();

  addMessage('user', query);
  inputEl.value = '';
  inputEl.disabled = true;
  sendBtn.disabled = true;

  const typingId = addTyping();

  try{
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query})
    });
    const data = await res.json();
    document.getElementById(typingId).remove();
    addMessage('assistant', data.answer, data.sources);
  }catch(err){
    document.getElementById(typingId).remove();
    addMessage('assistant', 'Error: could not reach the backend. Check that app.py is running.');
  }

  inputEl.disabled = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

function addMessage(role, text, sources){
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  msg.appendChild(bubble);

  if(sources && sources.length){
    const sourcesEl = document.createElement('div');
    sourcesEl.className = 'sources';
    sources.forEach(s => {
      const chip = document.createElement('a');
      chip.className = 'source-chip';
      chip.href = '/documents/' + s.source_file;
      chip.target = '_blank';
      chip.style.textDecoration = 'none';
      chip.style.color = 'inherit';
      chip.style.cursor = 'pointer';
      chip.innerHTML = `<span class="source-title">📄 ${s.title}</span><span class="source-cat">${s.category}</span>`;
      sourcesEl.appendChild(chip);
    });
    msg.appendChild(sourcesEl);
  }

  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTyping(){
  const id = 'typing-' + Date.now();
  const msg = document.createElement('div');
  msg.className = 'msg assistant';
  msg.id = id;
  msg.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return id;
}
</script>

</body>
</html>
